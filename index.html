
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キッチンセレクト | 調理家電・キッチン用品比較</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Meiryo", "Yu Gothic", sans-serif;
      background: #f5f7f9;
      color: #263238;
    }
    header {
      background: #176b57;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main { max-width: 1100px; margin: auto; padding: 24px 16px; }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #0000000a;
    }
    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      margin: 8px 0;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .product {
      border: 1px solid #e0e0e0;
      padding: 16px;
      border-radius: 10px;
    }
    .product h3 { font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
    .product { display: flex; flex-direction: column; gap: 8px; }
    .product img { width: 100%; height: 190px; object-fit: contain; background: #fff; }
    .product .button { margin-top: auto; text-align: center; }
    .product .category-label { margin: 0; color: #58656c; }
    .status { color: #58656c; margin: 0 0 16px; }
    .status.error { color: #a82c2c; }
    .empty { color: #58656c; margin: 0; }
    .price { font-size: 22px; font-weight: bold; color: #176b57; }
    .button {
      display: inline-block;
      background: #176b57;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .table-wrap { overflow-x: auto; }
    footer { text-align: center; padding: 24px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>キッチンセレクト</h1>
    <p>調理家電・キッチン用品を、わかりやすく比較。</p>
  </header>

  <main>
    <section class="panel">
      <h2>商品を探す</h2>
      <input id="search" placeholder="商品名で検索">
      <select id="category">
        <option value="">すべてのカテゴリー</option>
        <option value="炊飯器">炊飯器</option>
        <option value="電気ケトル">電気ケトル</option>
        <option value="電子レンジ">電子レンジ</option>
        <option value="ノンフライヤー">ノンフライヤー</option>
        <option value="フライパン">フライパン</option>
      </select>
    </section>

    <section class="panel">
      <h2>商品一覧</h2>
      <p id="status" class="status" role="status" aria-live="polite">商品情報を読み込み中です…</p>
      <div id="products" class="products"></div>
    </section>

    <section class="panel">
      <h2>商品比較表</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>商品名</th><th>カテゴリー</th><th>価格</th></tr>
          </thead>
          <tbody id="comparison"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>広告・アフィリエイトリンクを含む場合があります。価格や在庫は楽天市場の商品ページでご確認ください。</p>
    <p>© キッチンセレクト</p>
  </footer>

  <script>
    // 同じフォルダに置かれた公開用JSONを読み込みます。APIキーは不要です。
    let products = [];
    const searchInput = document.getElementById("search");
    const categorySelect = document.getElementById("category");
    const productContainer = document.getElementById("products");
    const comparisonBody = document.getElementById("comparison");
    const status = document.getElementById("status");
    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });

    function validHttpsUrl(value) {
      if (typeof value !== "string" || !value.trim()) return null;
      try {
        const url = new URL(value);
        return url.protocol === "https:" ? url.href : null;
      } catch {
        return null;
      }
    }

    function makeTextElement(tag, text, className) {
      const el = document.createElement(tag);
      el.textContent = text;
      if (className) el.className = className;
      return el;
    }

    function makeProductCard(p) {
      const card = document.createElement("article");
      card.className = "product";
      const imgUrl = validHttpsUrl(p.image);
      if (imgUrl) {
        const img = document.createElement("img");
        img.src = imgUrl;
        img.alt = p.name;
        img.loading = "lazy";
        card.append(img);
      }
      card.append(makeTextElement("h3", p.name));
      card.append(makeTextElement("p", p.category, "category-label"));
      card.append(makeTextElement("p", yen.format(p.price), "price"));
      const url = validHttpsUrl(p.url);
      if (url) {
        const link = makeTextElement("a", "楽天市場で商品を見る", "button");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer sponsored";
        card.append(link);
      }
      return card;
    }

    function render() {
      const keyword = searchInput.value.trim().toLocaleLowerCase("ja-JP");
      const category = categorySelect.value;
      const filtered = products.filter(p =>
        p.name.toLocaleLowerCase("ja-JP").includes(keyword) &&
        (!category || p.category === category)
      );

      productContainer.replaceChildren();
      comparisonBody.replaceChildren();
      for (const p of filtered) {
        productContainer.append(makeProductCard(p));
        const row = document.createElement("tr");
        for (const value of [p.name, p.category, yen.format(p.price)]) {
          row.append(makeTextElement("td", value));
        }
        comparisonBody.append(row);
      }
      if (!filtered.length) {
        productContainer.append(makeTextElement("p", "該当する商品がありません。", "empty"));
      }
      status.textContent = `${filtered.length}件の商品を表示中（登録 ${products.length}件）`;
      status.classList.remove("error");
    }

    async function loadProducts() {
      try {
        const response = await fetch("./site_products.json", { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("JSONが配列ではありません");
        products = data.filter(p => p && typeof p.name === "string" && p.name.trim() &&
          typeof p.category === "string" && Number.isFinite(Number(p.price)) && Number(p.price) >= 0)
          .map(p => ({
            name: p.name,
            category: p.category,
            price: Number(p.price),
            image: p.image,
            url: p.url
          }));
        // JSONに新しいカテゴリーが追加されても絞り込みに使えるようにします。
        const known = new Set([...categorySelect.options].map(o => o.value));
        for (const category of [...new Set(products.map(p => p.category))]) {
          if (!known.has(category)) {
            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            categorySelect.append(option);
          }
        }
        render();
      } catch (error) {
        status.textContent = "商品情報を読み込めませんでした。site_products.json が同じフォルダにあるか確認してください。";
        status.classList.add("error");
        console.error("商品データの読み込み失敗:", error);
      }
    }

    searchInput.addEventListener("input", () => { if (products.length) render(); });
    categorySelect.addEventListener("change", () => { if (products.length) render(); });
    loadProducts();
  </script>
</body>
</html>
