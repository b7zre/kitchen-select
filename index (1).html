
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キッチンセレクト | 調理家電・キッチン用品比較</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Meiryo", "Yu Gothic", sans-serif;
      background: #f5f7f9;
      color: #263238;
    }
    header {
      background: #176b57;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main { max-width: 1100px; margin: auto; padding: 24px 16px; }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #0000000a;
    }
    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      margin: 8px 0;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .product {
      border: 1px solid #e0e0e0;
      padding: 16px;
      border-radius: 10px;
    }
    .product h3 { font-size: 16px; }
    .price { font-size: 22px; font-weight: bold; color: #176b57; }
    .button {
      display: inline-block;
      background: #176b57;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .table-wrap { overflow-x: auto; }
    footer { text-align: center; padding: 24px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>キッチンセレクト</h1>
    <p>調理家電・キッチン用品を、わかりやすく比較。</p>
  </header>

  <main>
    <section class="panel">
      <h2>商品を探す</h2>
      <input id="search" placeholder="商品名で検索">
      <select id="category">
        <option value="">すべてのカテゴリー</option>
        <option value="炊飯器">炊飯器</option>
        <option value="電気ケトル">電気ケトル</option>
        <option value="電子レンジ">電子レンジ</option>
        <option value="ノンフライヤー">ノンフライヤー</option>
        <option value="フライパン">フライパン</option>
      </select>
    </section>

    <section class="panel">
      <h2>商品一覧</h2>
      <div id="products" class="products"></div>
    </section>

    <section class="panel">
      <h2>商品比較表</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>商品名</th><th>カテゴリー</th><th>価格</th></tr>
          </thead>
          <tbody id="comparison"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>広告・アフィリエイトリンクを掲載する予定です。</p>
    <p>© キッチンセレクト</p>
  </footer>

  <script>
    // 楽天API連携前の表示確認用サンプルデータ
    const products = [
      {name:"サンプル炊飯器",category:"炊飯器",price:9800},
      {name:"サンプル電気ケトル",category:"電気ケトル",price:3980},
      {name:"サンプル電子レンジ",category:"電子レンジ",price:15800},
      {name:"サンプルノンフライヤー",category:"ノンフライヤー",price:12800},
      {name:"サンプルフライパン",category:"フライパン",price:2980}
    ];

    function render() {
      const keyword = document.getElementById("search").value.toLowerCase();
      const category = document.getElementById("category").value;
      const filtered = products.filter(p =>
        p.name.toLowerCase().includes(keyword) &&
        (!category || p.category === category)
      );

      document.getElementById("products").innerHTML = filtered.map(p => `
        <article class="product">
          <h3>${p.name}</h3>
          <p>${p.category}</p>
          <p class="price">¥${p.price.toLocaleString()}</p>
          <p>表示確認用のサンプル商品です</p>
        </article>
      `).join("");

      document.getElementById("comparison").innerHTML = filtered.map(p => `
        <tr>
          <td>${p.name}</td>
          <td>${p.category}</td>
          <td>¥${p.price.toLocaleString()}</td>
        </tr>
      `).join("");
    }

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("category").addEventListener("change", render);
    render();
  </script>
</body>
</html>
