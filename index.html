
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キッチンセレクト | 調理家電・キッチン用品比較</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Meiryo", "Yu Gothic", sans-serif;
      background: #f5f7f9;
      color: #263238;
    }
    header {
      background: #176b57;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main { max-width: 1100px; margin: auto; padding: 24px 16px; }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #0000000a;
    }
    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      margin: 8px 0;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .product {
      border: 1px solid #e0e0e0;
      padding: 16px;
      border-radius: 10px;
    }
    .product h3 { font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
    .product { display: flex; flex-direction: column; gap: 8px; }
    .product img { width: 100%; height: 190px; object-fit: contain; background: #fff; }
    .product .button { margin-top: auto; text-align: center; }
    .product .category-label { margin: 0; color: #58656c; }
    .status { color: #58656c; margin: 0 0 16px; }
    .status.error { color: #a82c2c; }
    .empty { color: #58656c; margin: 0; }
    .price { font-size: 22px; font-weight: bold; color: #176b57; }
    .button {
      display: inline-block;
      background: #176b57;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .table-wrap { overflow-x: auto; }
    .product.selected { border: 2px solid #176b57; background: #f3faf7; }
    .compare-button { border: 1px solid #176b57; color: #176b57; background: white; padding: 10px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: bold; }
    .compare-button[aria-pressed="true"] { color: white; background: #176b57; }
    .compare-button:disabled { opacity: .45; cursor: not-allowed; }
    .compare-toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 8px 0 16px; }
    .compare-toolbar p { margin: 0; color: #58656c; }
    .clear-button { border: 1px solid #ccd6d1; background: white; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .clear-button:disabled { opacity: .5; cursor: not-allowed; }
    .compare-table { min-width: 570px; table-layout: fixed; }
    .compare-table th:first-child { width: 100px; }
    .compare-table td, .compare-table th { vertical-align: top; overflow-wrap: anywhere; }
    .compare-table td { min-width: 150px; }
    .compare-table img { width: 110px; height: 110px; object-fit: contain; display: block; margin: auto; }
    .compare-table .compare-price { font-size: 17px; font-weight: bold; color: #176b57; }
    .compare-table .button { font-size: 13px; padding: 9px; }
    .compare-table button { border: 0; background: none; text-decoration: underline; cursor: pointer; color: #176b57; }
    .review { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin: 0; font-size: 14px; }
    .review .star { color: #b4780a; font-weight: bold; }
    .review .score { font-weight: bold; }
    .review .count, .review-unavailable { color: #58656c; }
    .review-unavailable { margin: 0; font-size: 13px; }
    .description { font-size: 13px; line-height: 1.6; color: #526168; margin: 0; overflow-wrap: anywhere; }
    .description summary { color: #176b57; cursor: pointer; font-weight: bold; margin-top: 6px; }
    .description details p { margin: 6px 0 0; white-space: pre-wrap; max-height: 240px; overflow: auto; }
    .compare-table .description { max-width: 300px; }
    .data-note { margin: 12px 0 0; color: #647077; font-size: 12px; }
    footer { text-align: center; padding: 24px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>キッチンセレクト</h1>
    <p>調理家電・キッチン用品を、わかりやすく比較。</p>
  </header>

  <main>
    <section class="panel">
      <h2>商品を探す</h2>
      <input id="search" placeholder="商品名で検索">
      <select id="category">
        <option value="">すべてのカテゴリー</option>
        <option value="炊飯器">炊飯器</option>
        <option value="電気ケトル">電気ケトル</option>
        <option value="電子レンジ">電子レンジ</option>
        <option value="ノンフライヤー">ノンフライヤー</option>
        <option value="フライパン">フライパン</option>
      </select>
      <label for="sort">並べ替え</label>
      <select id="sort" aria-label="商品の並べ替え">
        <option value="default">標準順</option>
        <option value="price-asc">価格が安い順</option>
        <option value="price-desc">価格が高い順</option>
      </select>
    </section>

    <section class="panel">
      <h2>商品一覧</h2>
      <p id="status" class="status" role="status" aria-live="polite">商品情報を読み込み中です…</p>
      <div id="products" class="products"></div>
    </section>

    <section class="panel">
      <h2>商品を比較する</h2>
      <div class="compare-toolbar">
        <p id="compare-status" role="status" aria-live="polite">商品一覧から比較したい商品を最大3件選んでください。</p>
        <button type="button" id="clear-comparison" class="clear-button" disabled>選択をすべて解除</button>
      </div>
      <div id="comparison" class="table-wrap"></div>
      <p class="data-note">レビュー・商品説明は楽天市場に掲載されている情報をもとに表示しています。内容、価格、在庫は商品ページでご確認ください。</p>
    </section>
  </main>

  <footer>
    <p>広告・アフィリエイトリンクを含む場合があります。価格や在庫は楽天市場の商品ページでご確認ください。</p>
    <p>© キッチンセレクト</p>
  </footer>

  <script>
    // 同じフォルダに置かれた公開用JSONを読み込みます。APIキーは不要です。
    let products = [];
    const searchInput = document.getElementById("search");
    const categorySelect = document.getElementById("category");
    const sortSelect = document.getElementById("sort");
    const productContainer = document.getElementById("products");
    const comparisonContainer = document.getElementById("comparison");
    const compareStatus = document.getElementById("compare-status");
    const clearComparison = document.getElementById("clear-comparison");
    const selectedIds = new Set();
    const status = document.getElementById("status");
    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });

    function validHttpsUrl(value) {
      if (typeof value !== "string" || !value.trim()) return null;
      try {
        const url = new URL(value);
        return url.protocol === "https:" ? url.href : null;
      } catch {
        return null;
      }
    }

    function makeTextElement(tag, text, className) {
      const el = document.createElement(tag);
      el.textContent = text;
      if (className) el.className = className;
      return el;
    }

    // 数値が不明・未評価の場合に、星0点と誤解させないようにする。
    function reviewLabel(p) {
      if (p.reviewAverage === null || p.reviewCount === null || p.reviewCount <= 0) return null;
      return `★ ${p.reviewAverage.toFixed(1)} / 5（${p.reviewCount.toLocaleString("ja-JP")}件）`;
    }

    function makeReview(p) {
      const label = reviewLabel(p);
      if (!label) return makeTextElement("p", "レビュー情報なし", "review-unavailable");
      const review = document.createElement("p");
      review.className = "review";
      review.setAttribute("aria-label", `レビュー評価 ${p.reviewAverage.toFixed(1)}点、${p.reviewCount}件`);
      review.append(makeTextElement("span", "★", "star"));
      review.append(makeTextElement("span", `${p.reviewAverage.toFixed(1)} / 5`, "score"));
      review.append(makeTextElement("span", `（${p.reviewCount.toLocaleString("ja-JP")}件）`, "count"));
      return review;
    }

    function makeDescription(p, maxLength = 110) {
      if (!p.description) return makeTextElement("span", "商品説明なし", "review-unavailable");
      const wrapper = document.createElement("div");
      wrapper.className = "description";
      if (p.description.length <= maxLength) {
        wrapper.append(makeTextElement("span", p.description));
        return wrapper;
      }
      wrapper.append(makeTextElement("span", `${p.description.slice(0, maxLength)}…`));
      const details = document.createElement("details");
      details.append(makeTextElement("summary", "商品説明をもっと見る"));
      details.append(makeTextElement("p", p.description));
      wrapper.append(details);
      return wrapper;
    }

    function makeProductCard(p) {
      const card = document.createElement("article");
      card.className = "product";
      if (selectedIds.has(p.id)) card.classList.add("selected");
      const imgUrl = validHttpsUrl(p.image);
      if (imgUrl) {
        const img = document.createElement("img");
        img.src = imgUrl;
        img.alt = p.name;
        img.loading = "lazy";
        card.append(img);
      }
      card.append(makeTextElement("h3", p.name));
      card.append(makeTextElement("p", p.category, "category-label"));
      card.append(makeTextElement("p", yen.format(p.price), "price"));
      card.append(makeReview(p));
      card.append(makeDescription(p));
      const compareButton = makeTextElement("button", selectedIds.has(p.id) ? "✓ 比較から外す" : "＋ 比較に追加", "compare-button");
      compareButton.type = "button";
      compareButton.setAttribute("aria-pressed", String(selectedIds.has(p.id)));
      compareButton.disabled = !selectedIds.has(p.id) && selectedIds.size >= 3;
      compareButton.addEventListener("click", () => {
        if (selectedIds.has(p.id)) selectedIds.delete(p.id);
        else if (selectedIds.size < 3) selectedIds.add(p.id);
        render();
      });
      card.append(compareButton);
      const url = validHttpsUrl(p.url);
      if (url) {
        const link = makeTextElement("a", "楽天市場で商品を見る", "button");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer sponsored";
        card.append(link);
      }
      return card;
    }

    function makeAffiliateLink(p) {
      const url = validHttpsUrl(p.url);
      if (!url) return makeTextElement("span", "リンクなし");
      const link = makeTextElement("a", "楽天市場で見る", "button");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer sponsored";
      return link;
    }

    function renderComparison() {
      comparisonContainer.replaceChildren();
      const chosen = products.filter(p => selectedIds.has(p.id));
      compareStatus.textContent = chosen.length
        ? `${chosen.length}/3件を選択中。検索・並べ替えを変えても選択は維持されます。`
        : "商品一覧から比較したい商品を最大3件選んでください。";
      clearComparison.disabled = chosen.length === 0;
      if (!chosen.length) {
        comparisonContainer.append(makeTextElement("p", "比較する商品を選択すると、ここに横並びで表示されます。", "empty"));
        return;
      }
      const table = document.createElement("table");
      table.className = "compare-table";
      const tbody = document.createElement("tbody");
      const fields = [
        ["商品画像", p => {
          const url = validHttpsUrl(p.image);
          if (!url) return makeTextElement("span", "画像なし");
          const img = document.createElement("img");
          img.src = url;
          img.alt = p.name;
          img.loading = "lazy";
          return img;
        }],
        ["商品名", p => makeTextElement("span", p.name)],
        ["カテゴリー", p => makeTextElement("span", p.category)],
        ["価格", p => makeTextElement("span", yen.format(p.price), "compare-price")],
        ["レビュー評価", p => makeReview(p)],
        ["商品説明", p => makeDescription(p, 90)],
        ["商品ページ", p => makeAffiliateLink(p)],
        ["選択解除", p => {
          const btn = makeTextElement("button", "この商品を外す");
          btn.type = "button";
          btn.addEventListener("click", () => { selectedIds.delete(p.id); render(); });
          return btn;
        }]
      ];
      for (const [label, makeCellContent] of fields) {
        const row = document.createElement("tr");
        const th = makeTextElement("th", label);
        th.scope = "row";
        row.append(th);
        for (const p of chosen) {
          const td = document.createElement("td");
          td.append(makeCellContent(p));
          row.append(td);
        }
        tbody.append(row);
      }
      table.append(tbody);
      comparisonContainer.append(table);
    }

    function render() {
      const keyword = searchInput.value.trim().toLocaleLowerCase("ja-JP");
      const category = categorySelect.value;
      const filtered = products.filter(p =>
        p.name.toLocaleLowerCase("ja-JP").includes(keyword) &&
        (!category || p.category === category)
      );
      const sort = sortSelect.value;
      if (sort === "price-asc") filtered.sort((a, b) => a.price - b.price);
      else if (sort === "price-desc") filtered.sort((a, b) => b.price - a.price);

      productContainer.replaceChildren();
      for (const p of filtered) productContainer.append(makeProductCard(p));
      if (!filtered.length) productContainer.append(makeTextElement("p", "該当する商品がありません。", "empty"));
      status.textContent = `${filtered.length}件の商品を表示中（登録 ${products.length}件）`;
      status.classList.remove("error");
      renderComparison();
    }

    async function loadProducts() {
      try {
        const response = await fetch("./site_products.json", { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("JSONが配列ではありません");
        products = data.filter(p => p && typeof p.name === "string" && p.name.trim() &&
          typeof p.category === "string" && Number.isFinite(Number(p.price)) && Number(p.price) >= 0)
          .map((p, index) => ({
            id: index,
            name: p.name,
            category: p.category,
            price: Number(p.price),
            image: p.image,
            url: p.url,
            reviewAverage: Number.isFinite(Number(p.reviewAverage)) && p.reviewAverage !== null && p.reviewAverage !== "" && Number(p.reviewAverage) > 0 && Number(p.reviewAverage) <= 5 ? Number(p.reviewAverage) : null,
            reviewCount: Number.isInteger(Number(p.reviewCount)) && p.reviewCount !== null && p.reviewCount !== "" && Number(p.reviewCount) >= 0 ? Number(p.reviewCount) : null,
            description: typeof p.description === "string" ? p.description.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 3000) : ""
          }));
        // JSONに新しいカテゴリーが追加されても絞り込みに使えるようにします。
        const known = new Set([...categorySelect.options].map(o => o.value));
        for (const category of [...new Set(products.map(p => p.category))]) {
          if (!known.has(category)) {
            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            categorySelect.append(option);
          }
        }
        render();
      } catch (error) {
        status.textContent = "商品情報を読み込めませんでした。site_products.json が同じフォルダにあるか確認してください。";
        status.classList.add("error");
        console.error("商品データの読み込み失敗:", error);
      }
    }

    clearComparison.addEventListener("click", () => { selectedIds.clear(); render(); });
    searchInput.addEventListener("input", () => { if (products.length) render(); });
    categorySelect.addEventListener("change", () => { if (products.length) render(); });
    sortSelect.addEventListener("change", () => { if (products.length) render(); });
    loadProducts();
  </script>
</body>
</html>
